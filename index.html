<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. P's Homeroom</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="spring">
  <div class="theme-decor" aria-hidden="true"></div>

  <main class="page">
    <div class="toolbar">
      <label class="toolbar-control">
        <span class="toolbar-label">Theme</span>
        <select id="theme-select">
          <option value="auto">Auto (by date)</option>
          <option value="spring">Spring</option>
          <option value="summer">Summer</option>
          <option value="fall">Autumn</option>
          <option value="winter">Winter</option>
          <option value="valentines">Valentine's Day</option>
          <option value="stpatricks">St. Patrick's Day</option>
          <option value="independence">Independence Day</option>
          <option value="halloween">Halloween</option>
          <option value="thanksgiving">Thanksgiving</option>
          <option value="christmas">Christmas</option>
          <option value="newyear">New Year</option>
        </select>
      </label>
      <button id="fullscreen-btn" class="toolbar-btn" title="Toggle full screen">Full screen</button>
    </div>

    <header class="title-bar">
      <h1 contenteditable="true" data-storage="title">Mr. P's Homeroom</h1>
    </header>

    <section class="card date-card">
      <div class="card-header">Date / Cycle</div>
      <div class="card-body">
        <div id="date-line" class="date-line">&nbsp;</div>
      </div>
    </section>

    <div class="grid">
      <section class="card announcements-card">
        <div class="card-header">
          Reminders / Announcements
          <button id="edit-announcements" class="edit-btn" title="Edit announcements">edit</button>
        </div>
        <div class="card-body">
          <ul id="announcements" contenteditable="false" data-storage="announcements">
            <li>Welcome Back!</li>
          </ul>
        </div>
      </section>

      <section class="card video-card">
        <div class="card-header">
          Relaxing Video
          <button id="shuffle-video" class="edit-btn" title="Pick another video">shuffle</button>
        </div>
        <div class="card-body video-body">
          <div class="video-frame">
            <iframe
              id="video-iframe"
              src=""
              title="Relaxing video"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen></iframe>
          </div>
        </div>
      </section>

      <section class="card quote-card">
        <div class="card-header">
          Quote of the Day
          <button id="shuffle-quote" class="edit-btn" title="Pick another quote">shuffle</button>
        </div>
        <div class="card-body quote-body">
          <blockquote>
            <p id="quote-text">&nbsp;</p>
            <footer>&mdash; <span id="quote-author"></span></footer>
          </blockquote>
        </div>
      </section>
    </div>

    <section class="card spotify-card">
      <div class="card-header">
        Music
        <button id="edit-spotify" class="edit-btn" title="Paste a Spotify share link">edit</button>
      </div>
      <div class="card-body spotify-body">
        <div id="spotify-empty" class="spotify-empty">
          Click <strong>edit</strong> and paste any Spotify playlist, album, or track link.
        </div>
        <div id="spotify-editor" class="spotify-editor" hidden>
          <input
            id="spotify-input"
            type="text"
            placeholder="https://open.spotify.com/playlist/..."
            autocomplete="off"
            spellcheck="false" />
          <button id="spotify-save" class="toolbar-btn">Save</button>
          <button id="spotify-clear" class="toolbar-btn">Clear</button>
        </div>
        <iframe
          id="spotify-iframe"
          src=""
          title="Spotify player"
          width="100%"
          height="232"
          frameborder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"
          hidden></iframe>
      </div>
    </section>

    <footer class="page-footer"></footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
