<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homeroom Display</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-spring mode-view">
  <div class="theme-decor" aria-hidden="true"></div>

  <header id="toolbar" class="toolbar" hidden>
    <div class="toolbar-row">
      <label class="toolbar-field">
        <span>Page title</span>
        <input type="text" id="title-input" />
      </label>
      <label class="toolbar-field">
        <span>Template</span>
        <select id="template-picker"></select>
      </label>
      <span id="template-desc" class="toolbar-hint"></span>
      <button type="button" id="reset-btn" class="toolbar-btn">Reset</button>
      <button type="button" id="toggle-mode" class="toolbar-btn primary">Done (view)</button>
    </div>
  </header>

  <main class="page">
    <h1 id="page-title" class="page-title">Mr. P's Homeroom</h1>
    <div id="page-grid" class="page-grid"></div>
  </main>

  <aside id="side-panel" class="side-panel" hidden></aside>

  <button id="edit-fab" class="edit-fab" type="button" onclick="
    var u=new URL(location.href);
    u.searchParams.set('mode','edit');
    location.href=u.toString();
  ">Edit</button>

  <script type="module" src="app.js"></script>
</body>
</html>
